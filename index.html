<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#17191c; --bg2:#101113;
    --surface:#212327; --surface2:#2a2d31; --surface3:#33373c;
    --border:#34383d;
    --text:#f1efe9; --dim:#9aa0a6; --dim2:#6b7075;
    --accent:#e8b23d; --accent-dim:#8a6a24;
    --blue:#5b7cf7;
    --done:#3ddc84; --done-dim:#1f6b42;
    --danger:#e5484d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:70px;}
  h1,h2,h3,.display{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);}
  input,select,button,textarea{font-family:inherit;color:var(--text);}
  button{cursor:pointer;border:none;background:none;}
  .btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px;color:var(--text);}
  .btn:active{transform:scale(0.97);}
  .btn-accent{background:var(--accent);color:#1a1200;border:none;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-block{width:100%;text-align:center;}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
  input[type=text],input[type=number],input[type=email],input[type=password]{
    background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:15px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-dim);}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{font-size:26px;margin:0;color:var(--accent);}
  .content{padding:16px 16px 90px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .dim{color:var(--dim);}
  .dim2{color:var(--dim2);}
  .small{font-size:12px;}
  .tag{display:inline-block;background:var(--surface3);color:var(--dim);font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
  .tag-accent{background:var(--accent-dim);color:#ffe9b0;}
  .navbar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;max-width:520px;margin:0 auto;z-index:10;}
  .navbar button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim2);font-size:10px;font-weight:600;}
  .navbar button.active{color:var(--accent);}

async function loadProfile(){
  const ref = doc(db,'users',state.user.uid);
  const snap = await getDoc(ref);
  if(snap.exists()){
    state.profile = snap.data();
  } else {
    state.profile = {objective:null,bannedExercises:[],customExercises:[],sequenceQueue:[],sessionsPerWeek:4,unavailableDates:[],personalRecords:{}};
    await setDoc(ref, state.profile);
  }
  // migração suave para contas criadas antes desta funcionalidade
  if(state.profile.sessionsPerWeek===undefined) state.profile.sessionsPerWeek = state.profile.objective ? OBJECTIVES[state.profile.objective].defaultSessions : 4;
  if(!state.profile.unavailableDates) state.profile.unavailableDates = [];
  if(state.profile.weeklyQueue!==undefined){ delete state.profile.weeklyQueue; delete state.profile.weekStart; }
  if(!state.profile.sequenceQueue) state.profile.sequenceQueue = [];
  if(state.profile.sequencePos!==undefined){
    // migração da versão anterior (posição num ciclo) para fila explícita
    if(state.profile.objective){
      const pattern = OBJECTIVES[state.profile.objective].pattern;
      const q = [];
      for(let i=0;i<60;i++) q.push(pattern[(state.profile.sequencePos+i)%pattern.length]);
      state.profile.sequenceQueue = q;
    }
    delete state.profile.sequencePos;
  }
  if(state.profile.objective) ensureQueueLength(60);
  await saveProfile();
}

function ensureQueueLength(minLen){
  const profile = state.profile;
  if(!profile.objective) return;
  const pattern = OBJECTIVES[profile.objective].pattern;
  let i = 0;
  while(profile.sequenceQueue.length < minLen){
    profile.sequenceQueue.push(pattern[i % pattern.length]);
    i++;
  }
}

function buildSuggestion(dayType){
  if(dayType==='descanso') return {dayType, exercises:[]};
  const cats = DAYTYPE_CATS[dayType];
  const used = new Set();
  const exercises = [];
  for(const cat of cats){
    const pick = allExercises().find(e=> e.cat===cat && !isBanned(e.id) && !used.has(e.id));
    if(pick){ used.add(pick.id); exercises.push({...pick}); }
  }
  return {dayType, exercises};
}

async function weeklyCategoryVolume(){
  const seteDiasAtras = new Date(); seteDiasAtras.setDate(seteDiasAtras.getDate()-7);
  const desde = seteDiasAtras.toISOString().slice(0,10);
  const vol = {};
  try{
    const q = query(collection(db,'users',state.user.uid,'workouts'), where('startedAt','>=',desde));
    const snap = await getDocs(q);
    snap.forEach(d=>{
      const w = d.data();
      (w.exercises||[]).forEach(ex=>{
        const doneSets = (ex.sets||[]).filter(s=>s.done).length;
        vol[ex.cat] = (vol[ex.cat]||0) + doneSets;
      });
    });
  }catch(e){}
  return vol;
}

function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }

function pickEvenly(arr,n){
  if(n>=arr.length) return [...arr];
  if(n<=0) return [];
  const out = [];
  for(let i=0;i<n;i++) out.push(arr[Math.floor(i*arr.length/n)]);
  return out;
}

/**
 * Gera o plano de treinos para os próximos `numDias` a partir de hoje.
 * Devolve um objeto { 'AAAA-MM-DD': {type, indisponivel, seqIdx} }.
 * - Respeita profile.unavailableDates
 * - Distribui profile.sessionsPerWeek treinos por semana (seg-dom) pelos dias disponíveis
 * - Usa a fila contínua de tipos de treino (profile.sequenceQueue), nunca reinicia sozinha
 * - Evita repetir o mesmo tipo de treino em dias consecutivos, trocando a ordem quando possível
 * - seqIdx é a posição na fila persistida, usada para permitir trocas manuais (ver trocarDiaCalendario)
 */
function buildPlan(numDias){
  const profile = state.profile;
  const sessions = profile.sessionsPerWeek || 4;
  const bufferNeeded = Math.ceil((numDias/7)*sessions) + 8;
  ensureQueueLength(bufferNeeded);
  const seq = [...profile.sequenceQueue];

  const hoje = todayISO();
  const dates = [];
  for(let i=0;i<numDias;i++) dates.push(addDays(hoje,i));
  const weeks = {};
  dates.forEach(d=>{ const wk = mondayOf(d); (weeks[wk]=weeks[wk]||[]).push(d); });

  const plan = {};
  let seqIdx = 0;
  let last = state._ultimoTreino; // {type,date} ou null
  Object.keys(weeks).sort().forEach(wk=>{
    const weekDates = weeks[wk];
    const disponiveis = weekDates.filter(d=> !profile.unavailableDates.includes(d));
    const escolhidos = new Set(pickEvenly(disponiveis, sessions));
    weekDates.forEach(d=>{
      if(profile.unavailableDates.includes(d)){ plan[d] = {type:null, indisponivel:true}; return; }
      if(!escolhidos.has(d)){ plan[d] = {type:'descanso', indisponivel:false}; return; }
      let tipo = seq[seqIdx];
      const consecutivo = last && diffDays(last.date,d)===1;
      if(consecutivo && tipo===last.type && seq[seqIdx+1]!==undefined){
        seq[seqIdx]=seq[seqIdx+1]; seq[seqIdx+1]=tipo;
        tipo = seq[seqIdx];
      }
      plan[d] = {type:tipo, indisponivel:false, seqIdx};
      last = {type:tipo, date:d};
      seqIdx++;
    });
  });
  return plan;
}

window.trocarDiaCalendario = function(date, novoTipo){
  const info = state._planoCache[date];
  if(!info || info.seqIdx===undefined) return;
  const i = info.seqIdx;
  const queue = state.profile.sequenceQueue;
  ensureQueueLength(i+40);
  if(queue[i]===novoTipo){ fecharModal(); return; }
  let j = -1;
  for(let k=i+1;k<queue.length;k++){ if(queue[k]===novoTipo){ j=k; break; } }
  if(j===-1){ for(let k=i-1;k>=0;k--){ if(queue[k]===novoTipo){ j=k; break; } } }
  if(j===-1){ toast('Não encontrei esse tipo de treino na fila.'); return; }
  const [item] = queue.splice(j,1);
  queue.splice(i,0,item);
  saveProfile();
  state._planoCache = null;
  state.todaySuggestion = null;
  fecharModal();
  goCalendario();
};

window.trocarExercicio = async function(idx, modo){
  const sug = state.todaySuggestion;
  const original = sug.exercises[idx];
  const usedIds = new Set(sug.exercises.map(e=>e.id));
  let candidato = null;
  if(modo==='mesmo'){
    candidato = allExercises().find(e=> e.cat===original.cat && e.id!==original.id && !isBanned(e.id) && !usedIds.has(e.id));
  } else {
    const vol = await weeklyCategoryVolume();
    const cats = Object.keys(CATS).filter(c=>c!=='cardio' || sug.dayType==='cardio');
    cats.sort((a,b)=> (vol[a]||0)-(vol[b]||0));
    for(const c of cats){
      const found = allExercises().find(e=> e.cat===c && !isBanned(e.id) && !usedIds.has(e.id));
      if(found){ candidato = found; break; }
    }
  }
  if(!candidato){ toast('Não encontrei alternativa disponível.'); return; }
  state._pendingSwap = {idx, candidato, original};
  state.screen = 'swap-confirm';
  render();
};

window.confirmarTroca = function(permanente){
  const {idx, candidato, original} = state._pendingSwap;
  state.todaySuggestion.exercises[idx] = {...candidato};
  if(permanente){
    state.profile.bannedExercises = state.profile.bannedExercises||[];
    state.profile.bannedExercises.push(original.id);
    saveProfile();
  }
  state._pendingSwap = null;
  state.screen = 'main';
  render();
};

/**
 * Analisa as séries concluídas (com dificuldade registada) de uma sessão anterior
 * e devolve uma sugestão de progressão para a próxima vez.
 */
function sugestaoProgressao(sets){
  const avaliadas = (sets||[]).filter(s=>s.done && s.dificuldade);
  if(avaliadas.length===0) return null;
  const cont = {facil:0,moderado:0,dificil:0,falhei:0};
  avaliadas.forEach(s=>cont[s.dificuldade]++);
  if(cont.falhei>0) return {tipo:'reduzir', texto:'Não conseguiste completar alguma série. Sugiro manter o mesmo peso (ou baixar um pouco) e focar na técnica.'};
  if(cont.dificil > avaliadas.length/2) return {tipo:'manter', texto:'Foi bastante exigente. Mantém o mesmo peso desta vez e tenta consolidar as repetições.'};
  if(cont.facil === avaliadas.length) return {tipo:'aumentar', texto:'Todas as séries pareceram fáceis — está na hora de aumentar o peso (+2.5kg a +5kg) ou fazer mais repetições.'};
  if(cont.facil > avaliadas.length/2) return {tipo:'aumentar-leve', texto:'Correu bem. Podes tentar subir um pouco o peso ou mais 1-2 repetições por série.'};
  return {tipo:'manter', texto:'Intensidade equilibrada. Mantém o peso e tenta bater o número de repetições da última vez.'};
}

async function ultimaSessaoDoExercicio(exerciseId){

}

  if(rest) rest.textContent = formatTime(remaining);
  if(remaining<=0){ state.restTimer=null; render(); return; }
  setTimeout(tickTimer,1000);
}

async function atualizarPRs(w){
  state.profile.personalRecords = state.profile.personalRecords || {};
  let novoPR = false;
  for(const ex of w.exercises){
    if(ex.type!=='reps') continue;
    for(const s of ex.sets){
      if(!s.done || !s.kg || !s.reps) continue;
      const kg=parseFloat(s.kg), reps=parseInt(s.reps);
      if(!kg||!reps) continue;
      const oneRM = kg*(1+reps/30);
      const atual = state.profile.personalRecords[ex.exerciseId]?.oneRM || 0;
      if(oneRM > atual){
        state.profile.personalRecords[ex.exerciseId] = {oneRM:Math.round(oneRM*10)/10, kg, reps, date:todayISO(), name:ex.name};
        novoPR = true;
      }
    }
  }
  if(novoPR) toast('🏆 Novo recorde pessoal!');
  await saveProfile();
}

/* Calculadora de discos */
window.calcularDiscos = function(exIdx,setIdx){
  const s = state.activeWorkout.exercises[exIdx].sets[setIdx];
  const total = parseFloat(s.kg)||0;
  const barra = 20;
  let porLado = Math.max(0,(total-barra)/2);
  const discosDisp = [20,15,10,5,2.5,1.25];
  const usados = [];
  for(const d of discosDisp){
    while(porLado >= d - 0.001){ usados.push(d); porLado -= d; }
  }
  state._discosResultado = {total, usados};
  state.screen='discos-modal';
  render();
};

async function carregarWorkouts(){
  const q = query(collection(db,'users',state.user.uid,'workouts'), orderBy('startedAt','desc'), limit(200));
  const snap = await getDocs(q);
  state.workoutsCache = snap.docs.map(d=>d.data());
}

function calcularStreak(){
  const dias = [...new Set(state.workoutsCache.filter(w=>w.finishedAt).map(w=>w.startedAt.slice(0,10)))].sort().reverse();
  let streak=0; let cursor=new Date();
  for(const d of dias){
    const cursorISO = cursor.toISOString().slice(0,10);
    if(d===cursorISO){ streak++; cursor.setDate(cursor.getDate()-1); }
    else if(d < cursorISO) break;
  }
  return streak;
}

function volumePorGrupo(){
  const vol = {};
  const desde = new Date(); desde.setDate(desde.getDate()-28);
  state.workoutsCache.filter(w=>w.startedAt >= desde.toISOString()).forEach(w=>{
    (w.exercises||[]).forEach(ex=>{
      const sets = (ex.sets||[]).filter(s=>s.done).length;
      vol[ex.cat] = (vol[ex.cat]||0)+sets;
    });
  });
  return vol;
}

function historicoExercicio(exId){
  const pontos = [];
  [...state.workoutsCache].reverse().forEach(w=>{
    const ex = (w.exercises||[]).find(e=>e.exerciseId===exId);
    if(!ex) return;
    const melhorSet = ex.sets.filter(s=>s.done && s.kg && s.reps).sort((a,b)=>parseFloat(b.kg)-parseFloat(a.kg))[0];
    if(melhorSet) pontos.push({data:w.startedAt.slice(0,10), kg:parseFloat(melhorSet.kg)});
  });
  return pontos;
}

async function renderCalendario(){
  if(!state._ultimoTreino) state._ultimoTreino = await ultimoTreinoInfo();
  if(!state._planoCache) state._planoCache = buildPlan(28);
  const plano = state._planoCache;
  const hoje = todayISO();
  const dias = Object.keys(plano).sort();
  const semanas = {};
  dias.forEach(d=>{ const wk = mondayOf(d); (semanas[wk]=semanas[wk]||[]).push(d); });
  const nomesSemana = ['seg','ter','qua','qui','sex','sáb','dom'];

  el().innerHTML = `<div class="topbar"><h1>Calendário</h1></div>
  <div class="content">
    <div class="card row between">
      <div>
        <div class="small dim">Treinos por semana</div>
        <div style="font-size:22px" class="mono">${state.profile.sessionsPerWeek}x</div>
      </div>
      <div class="row" style="gap:8px">
        <button class="btn btn-sm" onclick="mudarSessoesPorSemana(-1)">−</button>
        <button class="btn btn-sm" onclick="mudarSessoesPorSemana(1)">+</button>
      </div>
    </div>
    <p class="small dim">Toca num dia futuro para o marcar como indisponível (ou disponível outra vez). A app reorganiza os treinos à volta disso automaticamente.</p>
    ${Object.keys(semanas).sort().map(wk=>{
      const weekDates = semanas[wk];
      const label = new Date(wk+'T00:00:00').toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'});
      return `<div class="card">
        <div class="small dim" style="text-transform:uppercase;margin-bottom:8px">Semana de ${label}</div>
        ${weekDates.map(d=>{
          const info = plano[d];
          const isPast = d < hoje;
          const isToday = d===hoje;
          const isWorkoutDay = !info.indisponivel && info.type && info.type!=='descanso';
          const weekday = nomesSemana[(new Date(d+'T00:00:00').getDay()+6)%7];
          const dnum = new Date(d+'T00:00:00').getDate();
          let label2;
          if(info.indisponivel) label2 = `<span style="color:var(--danger)">Indisponível</span>`;
          else if(info.type==='descanso') label2 = `<span class="dim">Descanso</span>`;
          else label2 = `<b>${labelForTipo(info.type)}</b> ${!isPast?'👁️':''}`;
          const clickHandler = isPast ? '' : (isWorkoutDay ? `onclick="previewDiaTreino('${d}')"` : `onclick="toggleDisponibilidade('${d}')"`);
          return `<div class="row between" style="padding:7px 0;border-top:1px solid var(--border);${isToday?'background:rgba(232,178,61,0.08);':''}${!isPast?'cursor:pointer;':''}" ${clickHandler}>
            <span class="mono ${isToday?'':'dim'}" style="width:70px">${weekday} ${dnum}${isToday?' · hoje':''}</span>
            <span style="flex:1;text-align:right">${label2}</span>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

async function renderSugestoes(){
  el().innerHTML = `<div class="topbar"><h1>Dicas</h1></div><div class="content"><p class="dim small">A analisar os teus treinos…</p></div>`;

  await carregarWorkouts();
  const pesagem = await sugestaoProximaPesagem();

  // agrupar séries com dificuldade por exercício, das últimas 3 sessões de cada
  const porExercicio = {};
  state.workoutsCache.forEach(w=>{
    (w.exercises||[]).forEach(ex=>{
      const avaliadas = (ex.sets||[]).filter(s=>s.done && s.dificuldade);
      if(avaliadas.length===0) return;
      porExercicio[ex.exerciseId] = porExercicio[ex.exerciseId] || {name:ex.name, sessoes:[]};
      if(porExercicio[ex.exerciseId].sessoes.length < 3){
        porExercicio[ex.exerciseId].sessoes.push({date:w.startedAt.slice(0,10), sets:avaliadas});
      }
    });
  });

  const cardsProgressao = [];
  const cardsTroca = [];
  Object.entries(porExercicio).forEach(([exId,info])=>{
    const ultima = info.sessoes[0];
    const sug = sugestaoProgressao(ultima.sets);
    if(!sug) return;
    const icon = sug.tipo==='aumentar' ? '📈' : sug.tipo==='aumentar-leve' ? '↗️' : sug.tipo==='reduzir' ? '📉' : '➡️';
    cardsProgressao.push(`<div class="card"><div class="row between"><b>${info.name}</b><span class="small dim">${ultima.date}</span></div><p class="small" style="margin:6px 0 0">${icon} ${sug.texto}</p></div>`);

    // se as últimas 2-3 sessões foram consistentemente difíceis/falhadas, sugerir troca
    const recentesDificeis = info.sessoes.filter(s => s.sets.some(x=>x.dificuldade==='dificil'||x.dificuldade==='falhei')).length;
    if(info.sessoes.length>=2 && recentesDificeis===info.sessoes.length){
      cardsTroca.push(`<div class="card"><b>${info.name}</b><p class="small dim" style="margin:6px 0 10px">Tem sido consistentemente difícil nas últimas sessões. Talvez valha a pena trocar de exercício por uns tempos.</p>
        <button class="btn btn-sm" onclick="goTab('hoje')">ver sugestão de hoje</button></div>`);
    }
  });

  const streak = calcularStreak();

  el().innerHTML = `<div class="topbar"><h1>Dicas</h1></div>
  <div class="content">
    <div class="card row between" style="border-color:${pesagem.overdue?'var(--accent)':'var(--border)'}">
      <div><div class="small dim">⚖️ Peso corporal</div><p class="small" style="margin:4px 0 0">${pesagem.texto}</p></div>
    </div>
    ${streak>=3 ? `<div class="card"><p class="small">🔥 Já vais em ${streak} dias seguidos de treino. Continua assim!</p></div>` : ''}
    ${cardsProgressao.length? `<div class="small dim" style="text-transform:uppercase;margin:14px 0 6px">Progressão sugerida</div>${cardsProgressao.join('')}` : ''}
    ${cardsTroca.length? `<div class="small dim" style="text-transform:uppercase;margin:14px 0 6px">Talvez trocar</div>${cardsTroca.join('')}` : ''}
    ${(cardsProgressao.length===0 && cardsTroca.length===0) ? `<div class="empty-state"><p>Ainda não há dados suficientes. Regista a dificuldade das séries nos teus treinos (😌💪🥵🛑) para começares a receber sugestões aqui.</p></div>` : ''}
  </div>`;
}

async function carregarPesos(n){
  try{
    const q = query(collection(db,'users',state.user.uid,'bodyweight'), orderBy('date','desc'), limit(n||30));
    const snap = await getDocs(q);
    return snap.docs.map(d=>d.data());
  }catch(e){ return []; }
}

window.registarPesoUI = async function(){
  const input = document.getElementById('peso-input');
  const kg = parseFloat(input.value);
  if(!kg || kg<=0){ toast('Introduz um peso válido.'); return; }
  await addDoc(collection(db,'users',state.user.uid,'bodyweight'), {date:todayISO(), kg});
  input.value='';
  toast('Peso registado');
  carregarHistoricoPesoUI();
};

async function carregarHistoricoPesoUI(){
  const slot = document.getElementById('peso-historico');
  if(!slot) return;
  const pesos = await carregarPesos(6);
  if(pesos.length===0){ slot.innerHTML = '<span>Ainda sem registos.</span>'; return; }
  slot.innerHTML = pesos.map(p=>`<div class="row between" style="padding:2px 0"><span>${p.date}</span><span class="mono">${p.kg} kg</span></div>`).join('');
}

/**
 * Calcula se já passou o intervalo recomendado desde a última pesagem,
 * consoante o objetivo (perder peso pede pesagens mais frequentes).
 */
async function sugestaoProximaPesagem(){
  const pesos = await carregarPesos(1);
  const intervalo = state.profile.objective==='peso' ? 7 : 14;
  if(pesos.length===0) return {overdue:true, texto:'Ainda não registaste o teu peso. Vale a pena começares a acompanhar.'};
  const dias = diffDays(pesos[0].date, todayISO());
  if(dias >= intervalo) return {overdue:true, texto:`Já lá vão ${dias} dias desde a última pesagem (${pesos[0].kg}kg em ${pesos[0].date}). Boa altura para voltares a pesar-te.`};
  return {overdue:false, texto:`Última pesagem há ${dias} dia(s) — ainda dentro do intervalo recomendado.`};
}

window.mudarObjetivo = function(v){
  state.profile.objective = v;
  state.profile.sequenceQueue = [];
  ensureQueueLength(60);
  state._planoCache = null;
  saveProfile();
  toast('Objetivo atualizado');
};
window.desbanir = function(id){
  state.profile.bannedExercises = state.profile.bannedExercises.filter(x=>x!==id);
  saveProfile(); render();
};
window.exportarDados = async function(){
  await carregarWorkouts();
  const pesos = await carregarPesos(500);
  const dados = {profile:state.profile, workouts:state.workoutsCache, bodyweight:pesos};
  const blob = new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'treinador-digital-dados.json';
  a.click();
};
